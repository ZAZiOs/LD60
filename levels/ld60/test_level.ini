[parent]
fullscreen = true
bg = assets/bg/intro_bg.png
shaders = none
music = crt, 0.80, 0.50

[room]
id = test_level
room_size = 320, 240
camera_size = 320, 240
bg = assets/level0/desktop/wp.png
cursor = assets/cursor.ini
spawn = 30, 224, assets/rage/rage_sh.ini
script = src.game.scripts.initestlogic

; --- TEMPLATES (PREFABS) ---
[template:note_window]
type = window
size = 192, 132
visible = false
is_solid = true

[template:shelf]
type = oneway
image = assets/level1/shelf2.png
one_way = true
boxes = 0,0,55,6,oneway

; --- ELEMENTS ---
[solid:taskbar]
pos = 0, 224
image = assets/level0/desktop/taskbar.png

[element:tutorial]
pos = 16, 0
image = assets/level0/desktop/tutorial.png
z_index = 1

[door:door]
pos = 240, 112
image = assets/level0/desktop/door.png
z_index = 2
on_interact = goto:level1, 0.4

[shelf:shelf_left]
pos = 45, 140
image = assets/level1/shelf2.png
boxes = 0,0,55,6,oneway

[shelf:shelf_right]
pos = 140, 90
image = assets/level1/shelf2.png
boxes = 0,0,55,6,oneway

[note_window:window_readme]
pos = 48, 38
size = 192, 132
title = README.TXT
text = """

Hey, buddy!

This level was loaded dynamically from an INI file!
Templates (prefabs) and element scripts are working!

Press ESC to go back to Menu.
"""
visible = false

[tab:tab_readme]
pos = 62, 226
idle = assets/level0/desktop/tab_readme.png
active = assets/level0/desktop/tab_readme_a.png
on_interact = toggle_window:window_readme
